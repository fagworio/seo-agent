# SEO Agent Control Center — deploy (F17).
# Arquitetura: Next.js (web) -> transporte stdlib/FastAPI-alvo (api) -> services
# hermes_seo_agent -> SQLite/GSC/GA4/CrUX/WordPress. Worker = Hermes/cron.
# Mesma origem em produção (ADR-0004): reverse proxy TLS na frente de web+api.
# O compose raiz (docker-compose.yml) é o worker standalone; este é o control plane.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: seo-agent-api
    env_file:
      - .env
    environment:
      SQLITE_PATH: /data/seo_agent.db
      # Produção atrás de TLS: SESSION_COOKIE_SECURE="true". Para teste local http
      # descomente a linha abaixo (o cookie deixa de exigir Secure).
      # SESSION_COOKIE_SECURE: "false"
    volumes:
      - seo-state:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: seo-agent-api
    command: ["hermes-seo-agent", "schedule"]
    env_file:
      - .env
    environment:
      SQLITE_PATH: /data/seo_agent.db
      DRY_RUN: "true"
    volumes:
      - seo-state:/data
    depends_on:
      - api

  web:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.web
    image: seo-agent-web
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "3000:3000"

  proxy:
    image: nginx:1.27-alpine
    depends_on:
      - web
    environment:
      SEO_AGENT_HOST: ${SEO_AGENT_HOST:?configure SEO_AGENT_HOST}
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ${TLS_CERTS_PATH:?configure TLS_CERTS_PATH}:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"

volumes:
  seo-state:
