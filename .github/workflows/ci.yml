name: Control Center CI
on:
  pull_request:
  push:
    branches: [main]
# cancela runs obsoletos do mesmo ref (evita gasto/duplicidade no CI).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      # instala também o extra `google` (google-auth): os conectores GSC/GA4 e o
      # teste de escopo do token GA4 dependem dele.
      - run: pip install '.[dev,google]'
      - run: pytest -q
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint && npm run typecheck && npm test && npm run build
      - working-directory: frontend
        run: npx playwright install --with-deps chromium && npm run test:e2e
      # o build valida que a imagem de produção constrói (inclui o extra [google]).
      - run: docker build -f Dockerfile.backend .
      - run: docker build -f Dockerfile.web frontend
